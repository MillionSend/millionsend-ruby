name: release

# Publishes to RubyGems via Trusted Publishing: configure rubygems.org → gem
# millionsend → Trusted publishers → add (MillionSend/millionsend-ruby,
# workflow release.yml). No API key stored anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for RubyGems Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rspec
      - uses: rubygems/release-gem@v1
