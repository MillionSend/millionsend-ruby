name: release

# Publishes to RubyGems via Trusted Publishing: configure rubygems.org → gem
# millionsend → Trusted publishers → add (MillionSend/millionsend-ruby,
# workflow release.yml). No API key stored anywhere.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # rake release pushes the version tag
      id-token: write # OIDC for RubyGems Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag publishes exactly the version the manifest declares; a tag that
      # disagrees with it is refused instead of shipping the wrong number.
      - name: Tag must match the manifest version
        if: github.ref_type == 'tag'
        run: test "v$(sed -n 's/.*VERSION = "\(.*\)"/\1/p' lib/millionsend/version.rb)" = "$GITHUB_REF_NAME"
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rspec
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1
