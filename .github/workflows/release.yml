name: release

# Publishes to RubyGems via Trusted Publishing: configure rubygems.org → gem
# millionsend → Trusted publishers → add (MillionSend/millionsend-ruby,
# workflow release.yml). No API key stored anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # rake release pushes the version tag
      id-token: write # OIDC for RubyGems Trusted Publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rspec
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1
